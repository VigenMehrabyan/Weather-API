<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Live weather, a 14-day forecast and past conditions for any city, with an animated sky that matches the weather."
    />
    <title>Weather</title>
    <link rel="icon" href="/weather.svg" type="image/svg+xml" />
    <script>
      // Apply the stored theme before first paint so a dark-mode reload never
      // flashes a white screen.
      (function () {
        try {
          var stored = localStorage.getItem("weather-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* storage blocked; fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
